<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animal Island UI 宣传片分镜</title>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("../assets/nunito-latin-400-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }

      @font-face {
        font-family: "Nunito";
        src: url("../assets/nunito-latin-700-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      @font-face {
        font-family: "Nunito";
        src: url("../assets/nunito-latin-800-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 800;
        font-display: block;
      }

      :root {
        --paper: #f0efeb;
        --paper-soft: #dfeadd;
        --mint: #8fcaa5;
        --night: #102f32;
        --night-soft: #1c4144;
        --ink: #3f2a17;
        --night-ink: #eef2ec;
        --font: "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
      }

      h1,
      p,
      figure {
        margin: 0;
      }

      img {
        display: block;
      }

      .scene {
        width: 1920px;
        height: 1080px;
        display: none;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 22px;
        padding: 34px 60px 26px;
      }

      html[data-scene="1"] [data-index="1"],
      html[data-scene="2"] [data-index="2"],
      html[data-scene="3"] [data-index="3"],
      html[data-scene="4"] [data-index="4"],
      html[data-scene="5"] [data-index="5"],
      html[data-scene="6"] [data-index="6"] {
        display: grid;
      }

      .scene--day {
        background: var(--mint);
      }

      .scene--paper {
        background: var(--paper);
      }

      .scene--mint {
        background: var(--paper-soft);
      }

      .scene--night {
        background: var(--night);
        color: var(--night-ink);
      }

      .scene-head {
        min-height: 72px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 40px;
        align-items: center;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .brand {
        width: 62px;
        height: 62px;
        flex: none;
      }

      .brand img {
        width: 100%;
        height: 100%;
      }

      h1 {
        max-width: 1420px;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .scene-meta {
        display: grid;
        gap: 5px;
        justify-items: end;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.2;
        opacity: 0.76;
      }

      .scene-meta strong {
        font-size: 25px;
        font-weight: 800;
      }

      .shot {
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .shot-frame {
        display: flex;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: rgb(255 255 255 / 18%);
      }

      .scene--night .shot-frame {
        background: rgb(255 255 255 / 9%);
      }

      .shot img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="scene scene--day" data-index="1" aria-label="第一幕：完整工作台">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>把 DSH 换成一整座岛</h1>
          </div>
          <p class="scene-meta"><strong>完整工作台</strong><span>日间 · 会话、设置与快捷键仍是原生 DSH</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/workspace-light.webp" width="1600" height="1000" alt="Animal Island UI 日间完整工作台" />
          </div>
        </figure>
      </section>

      <section class="scene scene--paper" data-index="2" aria-label="第二幕：完整外观设置">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>外观设置，仍在原来的路径里</h1>
          </div>
          <p class="scene-meta"><strong>完整设置窗口</strong><span>纸白 · 均衡 · 海岛三档浓度</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/appearance-light.webp" width="1600" height="1000" alt="Animal Island UI 日间完整外观设置窗口" />
          </div>
        </figure>
      </section>

      <section class="scene scene--night" data-index="3" aria-label="第三幕：完整夜间工作台">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>夜岛，不是反色</h1>
          </div>
          <p class="scene-meta"><strong>完整工作台</strong><span>夜间 · 暖棕内容面与深蓝侧栏</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/workspace-dark.webp" width="1600" height="1000" alt="Animal Island UI 夜间完整工作台" />
          </div>
        </figure>
      </section>

      <section class="scene scene--night" data-index="4" aria-label="第四幕：完整夜间外观设置">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>夜间设置，也有完整的层次</h1>
          </div>
          <p class="scene-meta"><strong>完整设置窗口</strong><span>夜间 · 纸面、选中态与焦点分别校准</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/appearance-dark.webp" width="1600" height="1000" alt="Animal Island UI 夜间完整外观设置窗口" />
          </div>
        </figure>
      </section>

      <section class="scene scene--mint" data-index="5" aria-label="第五幕：完整快捷键窗口">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>快捷键与焦点，仍是原生的</h1>
          </div>
          <p class="scene-meta"><strong>完整快捷键窗口</strong><span>搜索、列表与薄荷焦点环同时可见</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/shortcuts-light.webp" width="1600" height="1000" alt="Animal Island UI 完整快捷键窗口" />
          </div>
        </figure>
      </section>

      <section class="scene scene--night" data-index="6" aria-label="第六幕：启动画面与安装">
        <header class="scene-head">
          <div class="title-row">
            <span class="brand"><img src="../assets/loading-leaf.svg" alt="" /></span>
            <h1>装上这座岛</h1>
          </div>
          <p class="scene-meta"><strong>下载、校验、重启</strong><span>最新发布 · SHA256SUMS</span></p>
        </header>
        <figure class="shot">
          <div class="shot-frame">
            <img src="../assets/boot-dark.webp" width="1600" height="1102" alt="Animal Island UI 夜间完整启动画面" />
          </div>
        </figure>
      </section>
    </main>
    <script>
      const scene = new URLSearchParams(window.location.search).get("scene") ?? "1"
      document.documentElement.dataset.scene = /^[1-6]$/.test(scene) ? scene : "1"
    </script>
  </body>
</html>
