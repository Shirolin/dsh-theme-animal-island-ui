<!doctype html>
<!--
  The right sidebar's 「文档」 tab renders a plain-text view as
  [data-textpreview-plain] > pre[data-textpreview-page] > div[data-textpreview-line].
  It is flat on the sidebar surface (0 radius, transparent background), so the
  skin's code typography must not reach it — light mode used to render the body
  at ~1.35:1. Regression guard for that.
-->

<meta charset="utf-8">
<title>document preview — plain text</title>
<link rel="stylesheet" href="css/dsh.css">
<link rel="stylesheet" href="css/theme-base.css">
<link rel="stylesheet" href="css/plugins/sidebar-documentpreview.css">
<link rel="stylesheet" href="css/skin.css">
<style>
  body { margin: 0; padding: 18px 20px 24px; font-family: var(--dsw-font-family); background: var(--dsw-alias-bg-base); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.hint { font-size: 12px; opacity: .72; margin: 0 0 14px; }
  /* Sidebar surface: the token follows light/dark, so both variants are real. */
  .sidebarSurface { max-width: 780px; padding: 12px 14px; border-radius: 18px; background: var(--dsw-specific-sidebar-fill); }
</style>
</head>

<h1>文档预览 · 纯文本视图</h1>
<p class="hint">代码平铺在侧栏表面上（0 圆角、透明底），正文应使用 DSH 自身的文字颜色。</p>
<div class="sidebarSurface">
  <div class="dhJKeW_textDocument" data-textpreview-plain="true">
    <pre class="dhJKeW_page" data-textpreview-page="0"><div class="dhJKeW_line" data-textpreview-line="0"># Animal Island DSH skin — plain text view
</div><div class="dhJKeW_line" data-textpreview-line="1">
</div><div class="dhJKeW_line" data-textpreview-line="2">This file has no syntax highlighting, so the text uses whatever colour the
</div><div class="dhJKeW_line" data-textpreview-line="3">code block resolves to. It must stay readable on the light sidebar surface.
</div></pre>
  </div>
</div>
<script>
(() => {
  const doc = document.documentElement;
  const body = document.body;
  const initial = {
    decor: doc.getAttribute('data-animal-decor'),
    grain: doc.getAttribute('data-animal-grain'),
    diffSyntax: doc.getAttribute('data-animal-diff-syntax'),
    font: doc.getAttribute('data-animal-font'),
    veil: body.style.getPropertyValue('--animal-canvas-veil'),
    fontFamily: body.style.getPropertyValue('--dsw-font-family'),
  };
  const restoreAttr = (name, value) => {
    if (value === null) doc.removeAttribute(name);
    else doc.setAttribute(name, value);
  };
  const restoreProp = (name, value) => {
    if (value) body.style.setProperty(name, value);
    else body.style.removeProperty(name);
  };
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'animal-island:appearance') return;
    if (data.reset) {
      restoreAttr('data-animal-decor', initial.decor);
      restoreAttr('data-animal-grain', initial.grain);
      restoreAttr('data-animal-diff-syntax', initial.diffSyntax);
      restoreAttr('data-animal-font', initial.font);
      restoreProp('--animal-canvas-veil', initial.veil);
      restoreProp('--dsw-font-family', initial.fontFamily);
      return;
    }
    const patch = data.patch || {};
    if (patch.decor !== undefined) doc.setAttribute('data-animal-decor', patch.decor);
    if (patch.grain !== undefined) doc.setAttribute('data-animal-grain', patch.grain);
    if (patch.diffSyntax !== undefined) doc.setAttribute('data-animal-diff-syntax', patch.diffSyntax);
    if (patch.font !== undefined) {
      doc.setAttribute('data-animal-font', patch.font);
      if (patch.font === 'system') {
        body.style.setProperty('--dsw-font-family', 'var(--animal-system-font-family, sans-serif)');
      } else {
        restoreProp('--dsw-font-family', initial.fontFamily);
      }
    }
    if (patch.veil !== undefined) {
      body.style.setProperty('--animal-canvas-veil', String(patch.veil));
    }
  });
})();
</script>
