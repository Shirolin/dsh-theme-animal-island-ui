<!doctype html>
<!--
  Main conversation workspace fixture: reproduces Layout's centerCol (consuming
  --dsw-alias-bg-base), Conversation header crumbs + corner slot (triggering the
  wooden header ribbon), the Hero scenery slot, a markdown prose + code island
  bubble, and the Composer speech bubble with Model Selection.
-->
<html lang="zh-CN" data-dsh-animal-island-skin="active">
<head>
<meta charset="utf-8">
<title>主工作区 · 会话界面</title>
<link rel="stylesheet" href="css/dsh.css">
<link rel="stylesheet" href="css/theme-base.css">
<link rel="stylesheet" href="css/plugins/layout.css">
<link rel="stylesheet" href="css/plugins/conversation.css">
<link rel="stylesheet" href="css/plugins/chat.css">
<link rel="stylesheet" href="css/plugins/model-selection.css">
<link rel="stylesheet" href="css/skin.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  .workspace-frame {
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .workspace-frame .mP3x-q_centerCol {
    grid-area: 1 / 1;
    height: 100%;
    border-radius: 0 !important;
  }
  .an3WzG_root {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .an3WzG_scrollBody {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 28px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .demo-thread {
    width: min(740px, 100%);
    margin: 0 auto;
    display: grid;
    gap: 14px;
  }
  .demo-user-msg {
    justify-self: end;
    max-width: 80%;
    padding: 10px 16px;
    border-radius: 18px;
    background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-primary);
    font-size: 14px;
  }
  .demo-assistant-msg {
    color: var(--dsw-alias-label-primary);
    font-size: 14px;
    line-height: 1.65;
  }
  .demo-assistant-msg p { margin: 0 0 10px; }
  .demo-code-card {
    border-radius: var(--dsl-code-block-radius, 14px);
    background: var(--dsl-code-block-bg, var(--dsw-alias-markdown-code-block));
    overflow: hidden;
  }
  .demo-code-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--dsl-code-block-banner-bg, rgba(255, 255, 255, 0.04));
    font-size: 12px;
  }
  .demo-code-card pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .an3WzG_composerSeat {
    flex: none;
    padding: 8px 28px 20px;
  }
  .GRgSLq_root {
    width: min(740px, 100%);
    margin: 0 auto;
  }
  .GRgSLq_card {
    padding: 14px 16px 10px;
  }
  .GRgSLq_input {
    min-height: 36px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--dsw-alias-label-primary);
    outline: none;
  }
  .GRgSLq_row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .GRgSLq_tools,
  .GRgSLq_trailing,
  .GRgSLq_standardControls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .GRgSLq_add {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    cursor: pointer;
  }
  .GRgSLq_primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<script>
(() => {
  const doc = document.documentElement;
  const body = document.body;
  const initial = {
    decor: doc.getAttribute('data-animal-decor'),
    grain: doc.getAttribute('data-animal-grain'),
    diffSyntax: doc.getAttribute('data-animal-diff-syntax'),
    font: doc.getAttribute('data-animal-font'),
    veil: body.style.getPropertyValue('--animal-canvas-veil'),
    fontFamily: body.style.getPropertyValue('--dsw-font-family'),
  };
  const restoreAttr = (name, value) => {
    if (value === null) doc.removeAttribute(name);
    else doc.setAttribute(name, value);
  };
  const restoreProp = (name, value) => {
    if (value) body.style.setProperty(name, value);
    else body.style.removeProperty(name);
  };
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'animal-island:appearance') return;
    if (data.reset) {
      restoreAttr('data-animal-decor', initial.decor);
      restoreAttr('data-animal-grain', initial.grain);
      restoreAttr('data-animal-diff-syntax', initial.diffSyntax);
      restoreAttr('data-animal-font', initial.font);
      restoreProp('--animal-canvas-veil', initial.veil);
      restoreProp('--dsw-font-family', initial.fontFamily);
      return;
    }
    const patch = data.patch || {};
    if (patch.decor !== undefined) doc.setAttribute('data-animal-decor', patch.decor);
    if (patch.grain !== undefined) doc.setAttribute('data-animal-grain', patch.grain);
    if (patch.diffSyntax !== undefined) doc.setAttribute('data-animal-diff-syntax', patch.diffSyntax);
    if (patch.font !== undefined) {
      doc.setAttribute('data-animal-font', patch.font);
      if (patch.font === 'system') {
        body.style.setProperty('--dsw-font-family', 'var(--animal-system-font-family, sans-serif)');
      } else {
        restoreProp('--dsw-font-family', initial.fontFamily);
      }
    }
    if (patch.veil !== undefined) {
      body.style.setProperty('--animal-canvas-veil', String(patch.veil));
    }
  });
})();
</script>
