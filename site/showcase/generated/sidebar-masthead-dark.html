<!doctype html>
<!--
  Sidebar masthead — the ferry-ticket brand area as the user sees it.

  Reproduces the real 0.2.1-rc.5 sidebar DOM (wtg9ga_* module classes, taken from
  the installed client bundle) around the plugin's brand slots. The mint strip
  above the logo row is shell chrome (the desktop titlebar tabs); it is drawn
  here only so the masthead is judged in context, and no skin rule may target it.
-->
<html lang="zh-CN" data-dsh-animal-island-skin="active" data-windows-titlebar>
<head>
<meta charset="utf-8">
<title>sidebar masthead</title>
<link rel="stylesheet" href="css/dsh.css">
<link rel="stylesheet" href="css/theme-base.css">
<link rel="stylesheet" href="css/plugins/sidebar.css">
<link rel="stylesheet" href="css/plugins/workspace.css">
<link rel="stylesheet" href="css/skin.css">
<style>
  body { margin: 0; padding: 20px; background: #8fcaa5; }
  .stage { display: flex; gap: 20px; align-items: flex-start; }
  .frame { width: 280px; height: 660px; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 24px rgba(40, 60, 40, .18); }
  .frame.narrow { width: 240px; }
  .frame.tight { width: 180px; }
  .shellStrip { box-sizing: border-box; display: flex; align-items: center; gap: 18px; height: 36px; padding: 0 12px; background: var(--dsw-specific-sidebar-fill); color: var(--dsw-alias-label-primary); font-size: 14px; font-weight: 700; }
  .shellStrip .tab { padding: 0 2px; }
  .shellStrip .tab.on { border-bottom: 2px solid #6f451f; }
  .stripIcon { width: 16px; height: 16px; border: 1.6px solid currentColor; border-radius: 2px; position: relative; }
  .stripIcon::before { content: ''; position: absolute; inset: 0 auto 0 4px; border-left: 1.6px solid currentColor; }
  .frame .wtg9ga_root { height: calc(100% - 36px); }
  /* The Windows sidebar moves its collapse toggle into the native caption
     strip (position: fixed), which this fixture does not reproduce; the mint
     strip above already carries that control. */
  .frame .wtg9ga_toggle { display: none; }
</style>
</head>

<div class="stage">
  <div class="frame">
    <div class="shellStrip"><span class="stripIcon"></span><span class="tab on">应用</span><span class="tab">编辑</span></div>
    <div class="wtg9ga_root" id="root-280"></div>

  <div class="frame narrow">

<script>
const H = 'wtg9ga_';
const MARK = '<svg aria-hidden="true" class="animal-island-brand__mark" width="24" height="24" viewBox="0 0 64 64">'
  + '<g transform="rotate(-18 32 32)">'
  + '<path d="M32 54c0 5-2 8-7 9" fill="none" stroke="#2f7d3c" stroke-width="4.5" stroke-linecap="round"/>'
  + '<path d="M32 6C19 16 10 27 10 38c0 11 10 18 22 18s22-7 22-18C54 27 45 16 32 6Z" fill="#6cc35a" stroke="#2f7d3c" stroke-width="3.2" stroke-linejoin="round"/>'
  + '<path d="M32 12v37" stroke="#d9f2c1" stroke-width="3.4" stroke-linecap="round"/>'
  + '<path d="M32 25c-6-1-10-4-13-9M32 34c-7-1-12-4-15-8M32 43c-6 0-10-2-14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>'
  + '<path d="M32 25c6-1 10-4 13-9M32 34c7-1 12-4 15-8M32 43c6 0 10-2 14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>'
  + '</g></svg>';
const PANEL_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2h4a2 2 0 0 1 2 2v1a1.4 1.4 0 1 0 0 2.8V10a2 2 0 0 1-2 2H8a1.4 1.4 0 1 0-2.8 0H4a2 2 0 0 1-2-2V8a1.4 1.4 0 1 0 0-2.8V4a2 2 0 0 1 2-2Z"/></svg>';
const CLOCK_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.5"/></svg>';
const GRID_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>';

function sidebar(width) {
  return '<div class="' + H + 'logoRow" data-window-drag="true">'
    + '<button type="button" class="' + H + 'brand ' + H + 'wide" aria-label="新会话">'
    + '<span class="' + H + 'brandIdentity" aria-hidden="true">'
    + '<span class="' + H + 'brandMark"><div data-slot="" style="display: contents;">' + MARK + '</div></span>'
    + '<span class="' + H + 'brandName">'
    + '<div data-slot="" style="display: contents;"><span class="animal-island-brand__name"><strong>动森岛</strong><small>ANIMAL ISLAND</small></span></div>'
    + '</span></span></button>'
    + '<button type="button" class="' + H + 'iconButton ' + H + 'toggle" aria-label="收起侧栏">'
    + '<svg class="' + H + 'panelIcon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><path d="M6 2.5v11"/></svg>'
    + '</button></div>'
    + '<button type="button" class="' + H + 'newSession">'
    + '<span class="' + H + 'newSessionLabelMask"><span class="' + H + 'newSessionContent">'
    + '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 5.2v5.6M5.2 8h5.6"/></svg>'
    + '<span class="' + H + 'newSessionLabel ' + H + 'wide">新会话</span>'
    + '</span></span></button>'
    + '<nav class="' + H + 'panelList" aria-label="功能面板">'
    + panelRow('插件', PANEL_ICON) + panelRow('自动化任务', CLOCK_ICON) + panelRow('更多', GRID_ICON)
    + '</nav>'
    + '<div class="' + H + 'regionArea">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px;color:var(--animal-muted);font-size:12px;font-weight:800;letter-spacing:.06em">工作区<span style="display:flex;gap:10px;opacity:.75">⌕ ⚙ ＋</span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;color:var(--animal-body);font-size:13px;font-weight:700">▣ animal-island-demo</div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin:2px 0 0 12px;padding:7px 8px;border-radius:8px;background:#e5c99b;color:#4a2f17;font-size:13px;font-weight:700;box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(90,55,25,.22)">◌ 主题安装与验收</div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin:2px 0 0 12px;padding:7px 8px;border-radius:8px;color:var(--animal-body);font-size:13px">◌ 亮暗滚动与层级</div>'
    + '<div style="display:flex;align-items:center;gap:8px;padding:8px 6px;color:var(--animal-body);font-size:13px;font-weight:700">▤ README</div>'
    + '</div>'
    + '<div style="position:relative;height:24px;margin-top:-24px"><span class="GAkraW_fade"></span></div>'
    + '<div class="' + H + 'footArea"><div class="' + H + 'settingsArea" style="display:flex;align-items:center;gap:8px;padding:8px 6px;color:var(--animal-body);font-size:13px">◍ demo@example.com</div></div>';
}

function panelRow(label, icon) {
  return '<button type="button" class="' + H + 'panelRow">'
    + '<span class="' + H + 'panelGlyph">' + icon + '</span>'
    + '<span class="' + H + 'panelTitle ' + H + 'wide">' + label + '</span></button>';
}

document.getElementById('root-280').innerHTML = sidebar(280);
document.getElementById('root-240').innerHTML = sidebar(240);
document.getElementById('root-180').innerHTML = sidebar(180);
</script>
<script>
(() => {
  const doc = document.documentElement;
  const body = document.body;
  const initial = {
    decor: doc.getAttribute('data-animal-decor'),
    grain: doc.getAttribute('data-animal-grain'),
    diffSyntax: doc.getAttribute('data-animal-diff-syntax'),
    font: doc.getAttribute('data-animal-font'),
    veil: body.style.getPropertyValue('--animal-canvas-veil'),
    fontFamily: body.style.getPropertyValue('--dsw-font-family'),
  };
  const restoreAttr = (name, value) => {
    if (value === null) doc.removeAttribute(name);
    else doc.setAttribute(name, value);
  };
  const restoreProp = (name, value) => {
    if (value) body.style.setProperty(name, value);
    else body.style.removeProperty(name);
  };
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'animal-island:appearance') return;
    if (data.reset) {
      restoreAttr('data-animal-decor', initial.decor);
      restoreAttr('data-animal-grain', initial.grain);
      restoreAttr('data-animal-diff-syntax', initial.diffSyntax);
      restoreAttr('data-animal-font', initial.font);
      restoreProp('--animal-canvas-veil', initial.veil);
      restoreProp('--dsw-font-family', initial.fontFamily);
      return;
    }
    const patch = data.patch || {};
    if (patch.decor !== undefined) doc.setAttribute('data-animal-decor', patch.decor);
    if (patch.grain !== undefined) doc.setAttribute('data-animal-grain', patch.grain);
    if (patch.diffSyntax !== undefined) doc.setAttribute('data-animal-diff-syntax', patch.diffSyntax);
    if (patch.font !== undefined) {
      doc.setAttribute('data-animal-font', patch.font);
      if (patch.font === 'system') {
        body.style.setProperty('--dsw-font-family', 'var(--animal-system-font-family, sans-serif)');
      } else {
        restoreProp('--dsw-font-family', initial.fontFamily);
      }
    }
    if (patch.veil !== undefined) {
      body.style.setProperty('--animal-canvas-veil', String(patch.veil));
    }
  });
})();
</script>
</body>
