<!doctype html>
<!--
  Plugin manager rows and switches in light mode.

  The plugin creates the identity attributes on its list rows and uses the
  standard switch role. This fixture keeps a small, real DOM shape so the visual
  boundary and reading surface can be measured without copying the whole page.
-->
<html lang="zh-CN" data-dsh-animal-island-skin="active">
<head>
<meta charset="utf-8">
<title>插件管理 · 亮色可读性</title>
<link rel="stylesheet" href="css/dsh.css">
<link rel="stylesheet" href="css/theme-base.css">
<link rel="stylesheet" href="css/plugins/plugin-manager.css">
<link rel="stylesheet" href="css/skin.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background-color: #8fcaa5;
    background-image:
      radial-gradient(circle, rgba(74, 126, 83, .24) 1.25px, transparent 1.4px),
      radial-gradient(circle, rgba(245, 250, 222, .22) .85px, transparent 1px);
    background-position: 0 0, 8px 8px;
    background-size: 30px 30px, 15px 15px;
  }
  .fixture {
    position: relative;
    width: 760px;
    min-height: 460px;
    margin: 22px auto;
    padding: 22px 24px 70px;
    overflow: hidden;
    color: var(--animal-body);
    background: rgba(248, 248, 240, .18);
    border: 1px solid rgba(143, 118, 94, .2);
    border-radius: 22px;
  }
  .fixture::after {
    content: "";
    position: absolute;
    right: -40px;
    bottom: -22px;
    left: -40px;
    height: 96px;
    border-radius: 50% 50% 0 0;
    background: rgba(88, 170, 160, .2);
    pointer-events: none;
  }
  .fixture-title {
    position: relative;
    z-index: 1;
    margin: 0 0 18px;
    color: var(--animal-ink);
    font-size: 24px;
    font-weight: 900;
  }
  .V7pFBG_page {
    position: relative;
    z-index: 1;
    width: auto;
    padding: 0;
    overflow: visible;
  }
  .plugin-group + .plugin-group {
    margin-top: 22px;
  }
  .fixture .V7pFBG_cardTitle,
  .fixture .V7pFBG_cardDesc {
    position: relative;
    z-index: 1;
  }
  .fixture .V7pFBG_cardDesc {
    color: var(--animal-muted);
  }
</style>

<script>
(() => {
  const doc = document.documentElement;
  const body = document.body;
  const initial = {
    decor: doc.getAttribute('data-animal-decor'),
    grain: doc.getAttribute('data-animal-grain'),
    diffSyntax: doc.getAttribute('data-animal-diff-syntax'),
    font: doc.getAttribute('data-animal-font'),
    veil: body.style.getPropertyValue('--animal-canvas-veil'),
    fontFamily: body.style.getPropertyValue('--dsw-font-family'),
  };
  const restoreAttr = (name, value) => {
    if (value === null) doc.removeAttribute(name);
    else doc.setAttribute(name, value);
  };
  const restoreProp = (name, value) => {
    if (value) body.style.setProperty(name, value);
    else body.style.removeProperty(name);
  };
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'animal-island:appearance') return;
    if (data.reset) {
      restoreAttr('data-animal-decor', initial.decor);
      restoreAttr('data-animal-grain', initial.grain);
      restoreAttr('data-animal-diff-syntax', initial.diffSyntax);
      restoreAttr('data-animal-font', initial.font);
      restoreProp('--animal-canvas-veil', initial.veil);
      restoreProp('--dsw-font-family', initial.fontFamily);
      return;
    }
    const patch = data.patch || {};
    if (patch.decor !== undefined) doc.setAttribute('data-animal-decor', patch.decor);
    if (patch.grain !== undefined) doc.setAttribute('data-animal-grain', patch.grain);
    if (patch.diffSyntax !== undefined) doc.setAttribute('data-animal-diff-syntax', patch.diffSyntax);
    if (patch.font !== undefined) {
      doc.setAttribute('data-animal-font', patch.font);
      if (patch.font === 'system') {
        body.style.setProperty('--dsw-font-family', 'var(--animal-system-font-family, sans-serif)');
      } else {
        restoreProp('--dsw-font-family', initial.fontFamily);
      }
    }
    if (patch.veil !== undefined) {
      body.style.setProperty('--animal-canvas-veil', String(patch.veil));
    }
  });
})();
</script>
