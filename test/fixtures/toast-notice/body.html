<!doctype html>
<!--
  The floating toast DSH portals to <body> for copy / refresh / permission
  feedback. It sits on the theme's tooltip surface with DSH's static label and
  action colours, so this fixture measures the label, the success icon and the
  inline action against that surface.
-->
<html lang="zh-CN" data-dsh-animal-island-skin="active">
<head>
<meta charset="utf-8">
<title>浮层提示 · toast</title>
<!--{{DSH_CSS}}-->
<!--{{THEME_BASE_CSS}}-->
<!--{{PLUGIN_CSS}}-->
<!--{{SKIN_CSS}}-->
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background-color: #8fcaa5;
    background-image:
      radial-gradient(circle, rgba(74, 126, 83, .24) 1.25px, transparent 1.4px),
      radial-gradient(circle, rgba(245, 250, 222, .22) .85px, transparent 1px);
    background-position: 0 0, 8px 8px;
    background-size: 30px 30px, 15px 15px;
  }
  .fixture {
    width: 680px;
    margin: 130px auto 0;
    padding: 22px 26px;
    color: var(--animal-body);
    background: rgba(248, 248, 240, .18);
    border: 1px solid rgba(143, 118, 94, .2);
    border-radius: 22px;
    font-size: 15px;
  }
  /* Headless virtual time freezes the entrance animation mid-frame, so the
     fixture pins the settled state: this checks colours, not the fade. */
  ._toast_hr9yd_6 {
    opacity: 1 !important;
    animation: none !important;
  }
</style>
</head>
<body {{BODY_ATTRIBUTES}} style="{{TOKENS}} {{BODY_STYLE}}">
<div class="_toast_hr9yd_6" role="alert" style="--dsh-toast-hold: 600000ms">
  <span class="_icon_hr9yd_40 _success_hr9yd_47" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
  </span>
  <span class="_text_hr9yd_51">已复制<button type="button" class="_action_hr9yd_55">撤销</button></span>
</div>
<main class="fixture">会话内容（仅作为浮层落点的背景参照）</main>
</body>
</html>
