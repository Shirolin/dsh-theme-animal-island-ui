<!doctype html>
<!--
  Desktop client (Electron) sidebar brand area.

  DSH 0.2.1-rc.5 renders the sidebar under [data-windows-titlebar]: the logo row
  is 40px tall with no padding, the collapse toggle is position:fixed, and
  brandIdentity/brandMark carry a 1px transform. The plugin's brand-name slot
  lands inside DSH's `.brand`, a 24px box with `overflow: hidden` — so the whole
  two-line lockup has to fit in 24px or the glyph tops get shaved.

  That is what this fixture guards: the last case renders the same lockup with
  the `.brand` clipper switched off, so comparing the two cases' ink heights
  shows a shaved top the moment the budget is spent wrongly again.

  Hash prefixes are DSH's own CSS-module hashes for 0.2.1-rc.5. The skin must
  never use them; a fixture may, because it reproduces a real DOM shape.
-->
<html lang="zh-CN" data-dsh-animal-island-skin="active">
<head>
<meta charset="utf-8">
<title>sidebar brand — desktop 0.2.1-rc.5</title>
<!--{{DSH_CSS}}-->
<!--{{THEME_BASE_CSS}}-->
<!--{{PLUGIN_CSS}}-->
<!--{{SKIN_CSS}}-->
<style>
  body { margin: 0; padding: 14px 16px 20px; font-family: var(--dsw-font-family); background: var(--dsw-alias-bg-base); }
  h1 { font-size: 13px; margin: 0 0 10px; }
  .cases { display: flex; gap: 12px; align-items: flex-start; }
  .case > .cap { font-size: 10px; opacity: .7; margin-bottom: 4px; }
  .frame { border: 1px dashed rgba(120,120,120,.55); }
  #probe { font: 11px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre;
           background: #fff; color: #111; padding: 10px 12px; border: 1px solid #bbb; margin: 14px 0 0; }
  /* Control only: DSH's `.brand` is the clip box, so switch it off here. */
  .noBrandClip .wtg9ga_brand { overflow: visible; }
</style>
</head>
<body {{BODY_ATTRIBUTES}} style="{{BODY_STYLE}} {{TOKENS}}">
<h1>侧栏品牌区 · 桌面版 0.2.1-rc.5（[data-windows-titlebar]，DSH 的 24px 品牌盒会裁剪）</h1>
<div class="cases" id="cases"></div>
<pre id="probe"></pre>
<script>
const H = 'wtg9ga_';
const MARK = '<svg aria-hidden="true" class="animal-island-brand__mark" width="24" height="24" viewBox="0 0 64 64">'
  + '<g transform="rotate(-18 32 32)">'
  + '<path d="M32 54c0 5-2 8-7 9" fill="none" stroke="#2f7d3c" stroke-width="4.5" stroke-linecap="round"/>'
  + '<path d="M32 6C19 16 10 27 10 38c0 11 10 18 22 18s22-7 22-18C54 27 45 16 32 6Z" fill="#6cc35a" stroke="#2f7d3c" stroke-width="3.2" stroke-linejoin="round"/>'
  + '<path d="M32 12v37" stroke="#d9f2c1" stroke-width="3.4" stroke-linecap="round"/>'
  + '<path d="M32 25c-6-1-10-4-13-9M32 34c-7-1-12-4-15-8M32 43c-6 0-10-2-14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>'
  + '<path d="M32 25c6-1 10-4 13-9M32 34c7-1 12-4 15-8M32 43c6 0 10-2 14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>'
  + '</g></svg>';

function sidebar(width, extraClass) {
  return '<div data-windows-titlebar class="' + (extraClass ?? '') + '" style="display:inline-block">'
    + '<div class="' + H + 'root" style="width:' + width + 'px;height:150px">'
    + '<div class="' + H + 'logoRow" data-window-drag="true">'
    + '<button type="button" class="' + H + 'brand ' + H + 'wide">'
    + '<span class="' + H + 'brandIdentity" aria-hidden="true">'
    + '<span class="' + H + 'brandMark">' + MARK + '</span>'
    + '<span class="' + H + 'brandName">'
    + '<span class="animal-island-brand__name"><strong>动森岛</strong><small>ANIMAL ISLAND</small></span>'
    + '</span></span></button>'
    + '<button type="button" class="' + H + 'iconButton ' + H + 'toggle">'
    + '<svg class="' + H + 'panelIcon" width="16" height="16" viewBox="0 0 16 16">'
    + '<rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor"/></svg>'
    + '</button></div></div></div>';
}

document.getElementById('cases').innerHTML = [260, 220, 180, 148]
  .map((w) => '<div class="case"><div class="cap">sidebar ' + w + 'px</div>'
    + '<div class="frame">' + sidebar(w) + '</div></div>')
  .join('')
  + '<div class="case"><div class="cap">control · .brand unclipped</div>'
  + '<div class="frame">' + sidebar(260, 'noBrandClip') + '</div></div>';

const lines = [];
for (const el of document.querySelectorAll('.animal-island-brand__name')) {
  const strong = el.querySelector('strong');
  const small = el.querySelector('small');
  const range = document.createRange();
  range.selectNodeContents(strong);
  const text = range.getBoundingClientRect();
  const brand = el.closest('button, span[class*=brand]').getBoundingClientRect();
  const grid = el.getBoundingClientRect();
  const cap = el.closest('.case').querySelector('.cap').textContent;
  // Clearance: how far the wordmark's font box starts inside DSH's clip box.
  lines.push(cap
    + '\n  grid ' + grid.top.toFixed(1) + '..' + grid.bottom.toFixed(1)
    + ' (' + grid.height.toFixed(1) + 'px)  strong line-height ' + getComputedStyle(strong).lineHeight
    + '  small line-height ' + getComputedStyle(small).lineHeight
    + '  small margin-top ' + getComputedStyle(small).marginTop
    + '\n  wordmark font box ' + text.top.toFixed(1) + '..' + text.bottom.toFixed(1)
    + '  clip box ' + brand.top.toFixed(1) + '..' + brand.bottom.toFixed(1)
    + '  top clearance ' + (text.top - brand.top).toFixed(2) + 'px');
}
document.getElementById('probe').textContent = lines.join('\n');
</script>
</body>
</html>
