name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Verify repository
        run: pnpm run check

      - name: Pack release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --pack-destination "$RUNNER_TEMP/release"

      - name: Verify release metadata
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.tgz

      - name: Stage generic release assets
        run: |
          cp "$RUNNER_TEMP"/release/dsh-theme-animal-island-ui-*.tgz "$RUNNER_TEMP"/release/dsh-theme-animal-island-ui.tgz

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            pnpm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          fi
          pnpm publish --access public --no-git-checks --provenance
        continue-on-error: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/*.tgz \
            "$RUNNER_TEMP"/release/SHA256SUMS
