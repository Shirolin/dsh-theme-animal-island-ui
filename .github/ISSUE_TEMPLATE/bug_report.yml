name: 问题反馈
description: 皮肤在某处显示不对，或行为不符合预期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        贴图前请先确认：这是**皮肤**的问题，还是 DSH / 某个插件本身的问题？
        皮肤只叠加样式；把主题切到「无主题 / 其他主题」再复现一次，能快速区分。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: 主题版本、DSH 版本、操作系统
      placeholder: "theme <version> / DSH <version> / Windows 11"
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: 出问题的界面
      description: 越具体越好（设置 → 插件市场 / 右侧栏文档预览 / composer 的 `/` 面板 …）
      placeholder: "设置 → 插件市场 → 搜索框"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际
      description: 附前后对照或截图；亮色/暗色请注明
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 设置 → 插件市场
        2. 观察搜索框
    validations:
      required: false
  - type: textarea
    id: other-theme
    attributes:
      label: 换主题/停用主题后的表现
      description: 用于区分皮肤问题与 DSH/插件问题
    validations:
      required: false
