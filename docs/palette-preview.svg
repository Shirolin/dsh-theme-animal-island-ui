<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
  <title id="title">Animal Island DSH v0.3.x skin preview</title>
  <desc id="desc">A DSH skin concept: green dotted canvas, floating cream sidebar, wooden sign ribbon, speech-bubble composer, warm cards, and a dark code block.</desc>
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#4a7e53" opacity=".25"/>
      <circle cx="19" cy="19" r=".9" fill="#f5fada" opacity=".24"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#314b35" flood-opacity=".2"/>
    </filter>
    <pattern id="woodgrain" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#8a5a33"/>
      <rect width="2" height="9" fill="#000" opacity=".07"/>
    </pattern>
    <style>
      .ui { font-family: Nunito, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 25px; font-weight: 900; }
      .body { font-size: 14px; font-weight: 500; }
      .nav { font-size: 14px; font-weight: 800; }
      .small { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1480" height="760" fill="#8fcaa5"/>
  <rect width="1480" height="760" fill="url(#dots)"/>

  <g transform="translate(28 22)">
    <rect width="250" height="716" rx="20" fill="#faf8f3" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <g transform="translate(18 18)">
      <rect width="42" height="42" rx="13" fill="#e6f9f6"/>
      <g transform="translate(5 5) scale(0.5)">
        <g transform="rotate(-18 32 32)">
          <path d="M32 54c0 5-2 8-7 9" fill="none" stroke="#2f7d3c" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M32 6C19 16 10 27 10 38c0 11 10 18 22 18s22-7 22-18C54 27 45 16 32 6Z" fill="#6cc35a" stroke="#2f7d3c" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M32 12v37" stroke="#d9f2c1" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M32 25c-6-1-10-4-13-9M32 34c-7-1-12-4-15-8M32 43c-6 0-10-2-14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M32 25c6-1 10-4 13-9M32 34c7-1 12-4 15-8M32 43c6 0 10-2 14-6" fill="none" stroke="#a6dd8c" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </g>
      <text x="54" y="18" class="ui nav" fill="#6f451f">动森岛</text>
      <text x="54" y="35" class="ui small" fill="#827057" letter-spacing="1.4">ANIMAL ISLAND</text>
    </g>
    <rect x="16" y="76" width="218" height="44" rx="15" fill="#fffbe7" stroke="#c4b89e" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="104" text-anchor="middle" class="ui nav" fill="#6f451f">＋  新会话</text>
    <rect x="12" y="140" width="226" height="42" rx="14" fill="#e5c99b"/>
    <text x="42" y="166" class="ui nav" fill="#6f451f">代码审查</text>
    <rect x="12" y="190" width="226" height="42" rx="14" fill="#f0e2c8" opacity=".9"/>
    <text x="42" y="216" class="ui nav" fill="#6f451f">项目</text>
    <text x="24" y="272" class="ui nav" fill="#6f451f">工作区</text>
    <text x="24" y="307" class="ui body" fill="#654a2f">dsh-theme-animal</text>
    <text x="24" y="339" class="ui body" fill="#654a2f">Image</text>
    <text x="24" y="371" class="ui body" fill="#654a2f">short-vs-mvp</text>
    <path d="M0 594 C36 552 72 556 104 586 C136 616 170 620 204 590 C224 572 240 570 250 580 V716 H0 Z" fill="#a2b0e7"/>
    <rect x="16" y="624" width="218" height="42" rx="14" fill="#faf8f3" opacity=".94"/>
    <text x="42" y="650" class="ui nav" fill="#6f451f">设置</text>
  </g>

  <g transform="translate(306 22)">
    <rect width="1146" height="716" rx="26" fill="rgba(248,248,240,.91)" stroke="#dcd8d1" stroke-width="2" filter="url(#shadow)"/>
    <path d="M60 34 H420 L398 96 H82 L60 72 Z" fill="url(#woodgrain)" filter="url(#shadow)"/>
    <path d="M60 34 L82 72 L82 96 L60 72 Z" fill="#6e4527"/>
    <path d="M420 34 L398 72 L398 96 L420 72 Z" fill="#6e4527"/>
    <circle cx="74" cy="70" r="2.4" fill="#f3d9a8"/>
    <circle cx="406" cy="70" r="2.4" fill="#f3d9a8"/>
    <text x="240" y="72" text-anchor="middle" class="ui title" fill="#fff3d6">代码审查</text>
    <text x="66" y="136" class="ui title" fill="#6f451f">和 Agent 一起搭个小岛</text>
    <text x="66" y="164" class="ui body" fill="#654a2f">绿色波点、奶油卡片、薄荷交互与深色代码岛。</text>

    <rect x="66" y="190" width="1014" height="116" rx="22" fill="#ffffff" stroke="#dcd8d1" stroke-width="2"/>
    <circle cx="104" cy="228" r="18" fill="#82d5bb"/>
    <text x="140" y="224" class="ui nav" fill="#6f451f">小森助手</text>
    <text x="140" y="251" class="ui body" fill="#654a2f">公开 Slot 保留 DSH 的会话、设置和工作区行为，皮肤只接管视觉表现。</text>
    <rect x="140" y="266" width="112" height="24" rx="12" fill="#e6f9f6"/>
    <text x="196" y="282" text-anchor="middle" class="ui small" fill="#0b6d64">岛屿已连接</text>

    <rect x="66" y="328" width="1014" height="168" rx="20" fill="#2b2118" stroke="#3d3028" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="94" cy="356" r="6" fill="#fc736d"/><circle cx="114" cy="356" r="6" fill="#f7cd67"/><circle cx="134" cy="356" r="6" fill="#8ac68a"/>
    <text x="92" y="407" style="font-family:Consolas,monospace;font-size:15px;font-weight:600" fill="#e8d5bc">const skin = createAnimalIslandSkin()</text>
    <text x="92" y="439" style="font-family:Consolas,monospace;font-size:15px;font-weight:600" fill="#d4a0e0">await skin.apply({ slots, theme })</text>
    <text x="92" y="471" style="font-family:Consolas,monospace;font-size:13px" fill="#a69580">// no hashed classes · no DOM observers</text>

    <path d="M104 626 l16 24 l18-24 Z" fill="#fffbe7" stroke="#c4b89e" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="66" y="526" width="790" height="104" rx="28" fill="#fffbe7" stroke="#c4b89e" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="96" y="568" class="ui body" fill="#827057">给 Agent 发消息…</text>
    <rect x="66" y="648" width="104" height="30" rx="15" fill="#f8a6b2"/>
    <text x="118" y="668" text-anchor="middle" class="ui small" fill="#ffffff">设计令牌</text>
    <rect x="180" y="648" width="96" height="30" rx="15" fill="#b77dee"/>
    <text x="228" y="668" text-anchor="middle" class="ui small" fill="#ffffff">公开 Slot</text>
    <rect x="286" y="648" width="96" height="30" rx="15" fill="#889df0"/>
    <text x="334" y="668" text-anchor="middle" class="ui small" fill="#ffffff">生命周期</text>

    <rect x="880" y="526" width="200" height="104" rx="24" fill="#f8f8f0" stroke="#dcd8d1" stroke-width="2" filter="url(#shadow)"/>
    <text x="980" y="584" text-anchor="middle" class="ui nav" fill="#6f451f">创建新会话</text>
  </g>
</svg>
