<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="620" viewBox="0 0 1480 620" role="img" aria-labelledby="title desc">
  <title id="title">Animal Island DSH 主题色板预览</title>
  <desc id="desc">一动森 DSH 主题的 Light 与 Dark 模式界面色板预览。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3d3428" flood-opacity=".14"/>
    </filter>
    <style>
      .ui { font-family: Nunito, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 25px; font-weight: 800; }
      .subtitle { font-size: 13px; font-weight: 600; }
      .nav { font-size: 14px; font-weight: 700; }
      .body { font-size: 14px; font-weight: 500; }
      .small { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1480" height="620" fill="#e8dfc9"/>
  <text x="40" y="38" class="ui title" fill="#6f451f">一动森 · Animal Island DSH Theme</text>
  <text x="40" y="61" class="ui subtitle" fill="#654a2f">Light-first 奶油纸张 / 薄荷交互 / 蓝紫侧栏</text>

  <g transform="translate(40 86)">
    <rect width="680" height="490" rx="24" fill="#f8f8f0" stroke="#d8cdb9" stroke-width="2" filter="url(#shadow)"/>
    <rect width="176" height="490" rx="24" fill="#e8edf9"/>
    <rect x="152" width="24" height="490" fill="#e8edf9"/>
    <circle cx="31" cy="34" r="8" fill="#19c8b9"/>
    <text x="49" y="40" class="ui nav" fill="#6f451f">动森岛</text>
    <rect x="16" y="70" width="144" height="40" rx="14" fill="#b7c6e5"/>
    <text x="38" y="95" class="ui nav" fill="#6f451f">会话</text>
    <rect x="16" y="120" width="144" height="40" rx="14" fill="#d6dff0"/>
    <text x="38" y="145" class="ui nav" fill="#6f451f">项目</text>
    <text x="38" y="195" class="ui small" fill="#75634d">工作区</text>
    <text x="38" y="224" class="ui body" fill="#654a2f">主题验收</text>
    <text x="38" y="252" class="ui body" fill="#654a2f">DSH 接入</text>

    <text x="204" y="40" class="ui title" fill="#6f451f">和 Agent 一起搭个小岛</text>
    <text x="204" y="65" class="ui body" fill="#654a2f">柔和配色，也能保持长文本和代码的清晰可读。</text>
    <rect x="204" y="88" width="444" height="104" rx="20" fill="#f7f3df" stroke="#e2d4be" stroke-width="2"/>
    <circle cx="238" cy="123" r="15" fill="#82d5bb"/>
    <text x="266" y="119" class="ui nav" fill="#6f451f">小森助手</text>
    <text x="266" y="145" class="ui body" fill="#654a2f">我会把复杂的事情整理成清晰的小步骤。</text>
    <rect x="266" y="160" width="94" height="20" rx="10" fill="#e6f9f6"/>
    <text x="281" y="174" class="ui small" fill="#654a2f">已连接到岛屿</text>

    <rect x="204" y="210" width="444" height="142" rx="20" fill="#f0e8d8"/>
    <rect x="204" y="210" width="444" height="34" rx="16" fill="#e6dcc9"/>
    <circle cx="226" cy="227" r="5" fill="#e05a5a"/><circle cx="243" cy="227" r="5" fill="#f5c31c"/><circle cx="260" cy="227" r="5" fill="#6fba2c"/>
    <text x="222" y="275" class="ui body" fill="#604b35">const theme = 'animal-island';</text>
    <text x="222" y="303" class="ui body" fill="#a34e78">await island.apply();</text>
    <text x="222" y="331" class="ui small" fill="#75634d">// warm paper · mint primary · periwinkle</text>

    <rect x="204" y="376" width="318" height="48" rx="24" fill="#fffbe7" stroke="#c4b89e" stroke-width="2"/>
    <text x="228" y="406" class="ui body" fill="#75634d">给 Agent 发消息…</text>
    <rect x="532" y="376" width="116" height="48" rx="24" fill="#19c8b9"/>
    <text x="562" y="406" class="ui nav" fill="#2a2118">发送</text>
    <rect x="204" y="448" width="104" height="26" rx="13" fill="#e6f9f6"/>
    <text x="224" y="466" class="ui small" fill="#654a2f">主题已同步</text>
  </g>

  <g transform="translate(760 86)">
    <rect width="680" height="490" rx="24" fill="#29231c" stroke="#59493a" stroke-width="2" filter="url(#shadow)"/>
    <rect width="176" height="490" rx="24" fill="#303444"/>
    <rect x="152" width="24" height="490" fill="#303444"/>
    <circle cx="31" cy="34" r="8" fill="#61d9cb"/>
    <text x="49" y="40" class="ui nav" fill="#f7e7c7">动森岛</text>
    <rect x="16" y="70" width="144" height="40" rx="14" fill="#4c5f86"/>
    <text x="38" y="95" class="ui nav" fill="#f7e7c7">会话</text>
    <rect x="16" y="120" width="144" height="40" rx="14" fill="#3b455d"/>
    <text x="38" y="145" class="ui nav" fill="#f7e7c7">项目</text>
    <text x="38" y="195" class="ui small" fill="#cbb994">工作区</text>
    <text x="38" y="224" class="ui body" fill="#ead9bd">主题验收</text>
    <text x="38" y="252" class="ui body" fill="#ead9bd">DSH 接入</text>

    <text x="204" y="40" class="ui title" fill="#f7e7c7">夜间岛也保持温暖清晰</text>
    <text x="204" y="65" class="ui body" fill="#ead9bd">独立 dark 色板，不复用 Ember Dusk 的暖棕暗色。</text>
    <rect x="204" y="88" width="444" height="104" rx="20" fill="#362e25" stroke="#59493a" stroke-width="2"/>
    <circle cx="238" cy="123" r="15" fill="#61d9cb"/>
    <text x="266" y="119" class="ui nav" fill="#f7e7c7">小森助手</text>
    <text x="266" y="145" class="ui body" fill="#ead9bd">灯光暗下来，文字和代码仍然清楚。</text>
    <rect x="266" y="160" width="94" height="20" rx="10" fill="#294640"/>
    <text x="281" y="174" class="ui small" fill="#ead9bd">已连接到岛屿</text>

    <rect x="204" y="210" width="444" height="142" rx="20" fill="#211b16"/>
    <rect x="204" y="210" width="444" height="34" rx="16" fill="#30261f"/>
    <circle cx="226" cy="227" r="5" fill="#ff8b8b"/><circle cx="243" cy="227" r="5" fill="#ffd15a"/><circle cx="260" cy="227" r="5" fill="#a9db69"/>
    <text x="222" y="275" class="ui body" fill="#f3dfbd">const theme = 'animal-island';</text>
    <text x="222" y="303" class="ui body" fill="#f0a1c0">await island.apply();</text>
    <text x="222" y="331" class="ui small" fill="#a4937b">// warm paper · mint primary · periwinkle</text>

    <rect x="204" y="376" width="318" height="48" rx="24" fill="#362e25" stroke="#8a7057" stroke-width="2"/>
    <text x="228" y="406" class="ui body" fill="#a99173">给 Agent 发消息…</text>
    <rect x="532" y="376" width="116" height="48" rx="24" fill="#61d9cb"/>
    <text x="562" y="406" class="ui nav" fill="#2a2118">发送</text>
    <rect x="204" y="448" width="104" height="26" rx="13" fill="#294640"/>
    <text x="224" y="466" class="ui small" fill="#ead9bd">主题已同步</text>
  </g>
</svg>
